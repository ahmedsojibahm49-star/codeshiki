name: Build APK

# Builds a release APK on every push to main and on manual dispatch.
# The APK is uploaded as an artifact (codeshikhi-apk) — download it from the
# Actions run. When a version tag (v1.0.0, v1.1.0, ...) is pushed, the APK is
# ALSO published as a GitHub Release with the APK attached.
#
# To publish a release: git tag v1.0.0 && git push origin v1.0.0
#
# NOTE: this workflow does NOT run build_runner. Hive models are plain
# Map<String, dynamic> (no codegen, no adapters) — nothing to generate.
# Android Lint is disabled for release builds in android/app/build.gradle.kts
# because lint crashes on the video_player_android plugin (a lint bug).
#
# GRADLE HARDENING (Nov 2026): Flutter's included `flutter_tools/gradle`
# build resolves its plugin dependencies ONLY from the Gradle Plugin Portal,
# which 303-redirects Kotlin artifacts to Maven Central — a hop that failed
# once and broke the build with "Could not find
# org.jetbrains.kotlin:kotlin-stdlib:2.3.20". The "Install Gradle
# plugin-repo init script" step below installs
# android/gradle-init/plugin-repos.gradle into ~/.gradle/init.d/ so plugin
# dependencies resolve straight from Maven Central. The build step also
# retries once after 30s, so a genuine transient network blip cannot fail
# the run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Gradle plugin-repo init script
        run: |
          mkdir -p ~/.gradle/init.d
          cp android/gradle-init/plugin-repos.gradle ~/.gradle/init.d/
          echo "Installed plugin-repos.gradle — plugin deps resolve from Maven Central directly."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release || (echo "First build attempt failed — retrying once in 30s..." && sleep 30 && flutter build apk --release)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeshikhi-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk codeshikhi-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codeshikhi-${{ github.ref_name }}.apk
          name: CodeShikhi ${{ github.ref_name }}
          body: |
            CodeShikhi — learn programming in Bangla (Flutter demo app).
            Install the APK below (allow "Install unknown apps" when asked).
            Demo login: demo@codeshikhi.app / demo1234.
